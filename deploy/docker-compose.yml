# Phase 5 deployment topology for a single VM.
#
# The api service talks to the host Docker daemon (via the mounted socket) to
# launch ephemeral runner containers, so it must run with access to
# /var/run/docker.sock. Caddy terminates TLS and reverse-proxies to the api and
# frontend (see deploy/Caddyfile).

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      - CLOUD_AGENTS_WHITELIST=${CLOUD_AGENTS_WHITELIST:-}
      # GitHub OAuth app credentials (optional). Unset -> oauthConfigured()
      # is false, the frontend never shows "Sign in with GitHub" or
      # enforces the login guard, and the API accepts only the
      # CLOUD_AGENTS_API_TOKEN bearer.
      - CLOUD_AGENTS_GITHUB_CLIENT_ID=${CLOUD_AGENTS_GITHUB_CLIENT_ID:-}
      - CLOUD_AGENTS_GITHUB_CLIENT_SECRET=${CLOUD_AGENTS_GITHUB_CLIENT_SECRET:-}
      # Idiomatic Lyric alternative to the two vars above (D046,
      # docs/25-config-blocks.md) — they take priority over the
      # CLOUD_AGENTS_* names above when set, and are entirely optional
      # (oauth.l's config Github{} block falls back to the plain names when
      # unset). CAUTION: if you set the client-id/client-secret config-block
      # overrides, also set the whitelist one (or keep CLOUD_AGENTS_WHITELIST
      # set) — an empty whitelist on either path means open access to any
      # authenticated GitHub user, not "no one".
      - LYRIC_CONFIG_CLOUDAGENTS_OAUTH_GITHUB_CLIENTID=${LYRIC_CONFIG_CLOUDAGENTS_OAUTH_GITHUB_CLIENTID:-}
      - LYRIC_CONFIG_CLOUDAGENTS_OAUTH_GITHUB_CLIENTSECRET=${LYRIC_CONFIG_CLOUDAGENTS_OAUTH_GITHUB_CLIENTSECRET:-}
      - LYRIC_CONFIG_CLOUDAGENTS_OAUTH_GITHUB_WHITELIST=${LYRIC_CONFIG_CLOUDAGENTS_OAUTH_GITHUB_WHITELIST:-}
      # Network policy for the 'restricted' profile: the Docker network runner
      # containers join, and an optional egress proxy. Unset -> 'restricted'
      # fails closed to no network (#306). The API reads these to set each
      # runner container's NetworkMode; they must be forwarded here or the
      # 'restricted' join-network branch is unreachable.
      - CLOUD_AGENTS_RESTRICTED_NETWORK=${CLOUD_AGENTS_RESTRICTED_NETWORK:-}
      - CLOUD_AGENTS_EGRESS_PROXY=${CLOUD_AGENTS_EGRESS_PROXY:-}
      # Explicit DNS servers pinned on 'full'-policy runner containers (the
      # default-bridge DNS-resolution fix — see .env.example for why). Same
      # forwarding requirement as the two vars above.
      - CLOUD_AGENTS_RUNNER_DNS=${CLOUD_AGENTS_RUNNER_DNS:-}
      # Corporate-proxy TLS interception (#648): docker_manager.l's
      # createRunnerContainer reads these from the api PROCESS's own
      # environment, so they must be listed here or they never reach it —
      # Compose does not forward arbitrary host env vars into a container.
      # NODE_EXTRA_CA_CERTS's value is bind-mounted straight into each
      # runner container as its source path, and that bind mount is
      # resolved by the DOCKER HOST's dockerd (this is docker-outside-of-
      # docker: api talks to the host daemon over the mounted socket above)
      # — so the path must exist on the Docker host's filesystem, NOT
      # merely inside the api container. See deploy/RUNBOOK.md.
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-}
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-}
      # Session-visibility extras (docs/session-visibility.md, #810): the
      # env-gated highlights summarizer and the opt-in agent-plan ingestion.
      # All optional; unset keeps both features off.
      - CLOUD_AGENTS_SUMMARIZER_URL=${CLOUD_AGENTS_SUMMARIZER_URL:-}
      - CLOUD_AGENTS_SUMMARIZER_MODEL=${CLOUD_AGENTS_SUMMARIZER_MODEL:-}
      - CLOUD_AGENTS_SUMMARIZER_KEY=${CLOUD_AGENTS_SUMMARIZER_KEY:-}
      - CLOUD_AGENTS_INGEST_AGENT_PLAN=${CLOUD_AGENTS_INGEST_AGENT_PLAN:-}
      # CLOUD_AGENTS_ENABLED_HARNESSES (GET /api/harnesses, #523) is
      # deliberately left unset here: install-docker.sh builds all five
      # runner images unconditionally on this standalone-VM path, so there's
      # nothing to restrict — unset means "every harness enabled" (fail
      # open). docker-compose.coolify.yml now leaves it unset too, for the
      # same reason (all five runner images there build unconditionally as
      # well).
      # Persistent files: artifact bytes and chat-attachment bytes live under CLOUD_AGENTS_DATA_DIR, a HOST
      # directory bind-mounted into this container at the SAME path (volumes
      # below). Without these, both defaulted to a relative path inside the
      # container's writable layer (/app), so every redeploy discarded them.
      # Everything else is in Postgres (the postgres service below). The same-path mount matters for
      # attachments specifically: their directory is bind-mounted into runner
      # containers by the HOST's dockerd (docker-outside-of-docker, like
      # NODE_EXTRA_CA_CERTS below), so the path the api process sees must also
      # exist at that exact path on the host.
      - CLOUD_AGENTS_ARTIFACTS_DIR=${CLOUD_AGENTS_DATA_DIR:-/var/lib/cloud-agents}/artifacts
      - CLOUD_AGENTS_ATTACHMENTS_DIR=${CLOUD_AGENTS_DATA_DIR:-/var/lib/cloud-agents}/attachments
      - LYRIC_CONFIG_WEB_SERVER_PORT=8080
      # The operator bearer token. Required: the maintenance poller below
      # authenticates with it. Without it or GitHub OAuth, the API refuses
      # every request (docs/CAPABILITY_AUDIT.md §2.2).
      - CLOUD_AGENTS_API_TOKEN=${CLOUD_AGENTS_API_TOKEN:?set CLOUD_AGENTS_API_TOKEN in .env}
      # The Postgres service role (docs/phase11-postgres-tenancy.md §5.1),
      # where every store lives. Startup checks that the role cannot bypass
      # row-level security, that the provisioned roles exist and that the
      # schema is migrated, and refuses to start otherwise.
      - LYRIC_CONFIG_DB_CONNECTION_URL=postgres://cloudagents_app:${CLOUD_AGENTS_PG_APP_PASSWORD:?set CLOUD_AGENTS_PG_APP_PASSWORD in .env}@postgres:5432/cloudagents
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - user_data:/user-home
      - ${CLOUD_AGENTS_DATA_DIR:-/var/lib/cloud-agents}:${CLOUD_AGENTS_DATA_DIR:-/var/lib/cloud-agents}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Postgres (docs/phase11-postgres-tenancy.md §8). On first start with an
  # empty volume, deploy/postgres/init.sh runs provision.sql to create the
  # cloudagents database and its roles. The passwords must be letters and
  # digits only (openssl rand -hex 24). The superuser password is used only
  # inside this container; never give it to the API.
  postgres:
    build:
      context: ..
      dockerfile: deploy/postgres.Dockerfile
    environment:
      - POSTGRES_PASSWORD=${CLOUD_AGENTS_PG_SUPERUSER_PASSWORD:?set CLOUD_AGENTS_PG_SUPERUSER_PASSWORD in .env}
      - CLOUD_AGENTS_PG_OWNER_PASSWORD=${CLOUD_AGENTS_PG_OWNER_PASSWORD:?set CLOUD_AGENTS_PG_OWNER_PASSWORD in .env}
      - CLOUD_AGENTS_PG_APP_PASSWORD=${CLOUD_AGENTS_PG_APP_PASSWORD:?set CLOUD_AGENTS_PG_APP_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, so it only passes once first-start provisioning has
      # finished (the init scripts run with TCP disabled).
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "cloudagents"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped

  # Applies the Postgres schema as cloudagents_owner (`--migrate`), then
  # exits; the API starts only after it succeeds. The owner's credentials go
  # only to this one-shot container, never to the API.
  migrate:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["--migrate"]
    environment:
      - CLOUD_AGENTS_MIGRATE_DATABASE_URL=postgres://cloudagents_owner:${CLOUD_AGENTS_PG_OWNER_PASSWORD:?set CLOUD_AGENTS_PG_OWNER_PASSWORD in .env}@postgres:5432/cloudagents
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The maintenance poller (deploy/maintenance.sh): the API has no
  # in-process timer, so this calls its maintenance endpoints on a schedule.
  # /api/maintenance/reap is what frees sessions whose run died (a restart,
  # a crash); without it they stay RUNNING. Intervals are in seconds; 0
  # disables an endpoint. Each endpoint also has a call timeout.
  maintenance:
    build:
      context: ..
      dockerfile: deploy/maintenance.Dockerfile
    environment:
      - CLOUD_AGENTS_API_TOKEN=${CLOUD_AGENTS_API_TOKEN:?set CLOUD_AGENTS_API_TOKEN in .env}
      - CLOUD_AGENTS_API_URL=http://api:8080
      - MAINTENANCE_REAP_SECONDS=${MAINTENANCE_REAP_SECONDS:-60}
      - MAINTENANCE_TRIGGER_JOBS_SECONDS=${MAINTENANCE_TRIGGER_JOBS_SECONDS:-60}
      - MAINTENANCE_DRAIN_GRAPH_INGEST_SECONDS=${MAINTENANCE_DRAIN_GRAPH_INGEST_SECONDS:-60}
      - MAINTENANCE_OBSERVE_SECONDS=${MAINTENANCE_OBSERVE_SECONDS:-60}
      - MAINTENANCE_LEDGER_SYNC_SECONDS=${MAINTENANCE_LEDGER_SYNC_SECONDS:-300}
      - MAINTENANCE_REAP_TIMEOUT_SECONDS=${MAINTENANCE_REAP_TIMEOUT_SECONDS:-1800}
      - MAINTENANCE_TRIGGER_JOBS_TIMEOUT_SECONDS=${MAINTENANCE_TRIGGER_JOBS_TIMEOUT_SECONDS:-10800}
      - MAINTENANCE_DRAIN_GRAPH_INGEST_TIMEOUT_SECONDS=${MAINTENANCE_DRAIN_GRAPH_INGEST_TIMEOUT_SECONDS:-1800}
      - MAINTENANCE_OBSERVE_TIMEOUT_SECONDS=${MAINTENANCE_OBSERVE_TIMEOUT_SECONDS:-10800}
      - MAINTENANCE_LEDGER_SYNC_TIMEOUT_SECONDS=${MAINTENANCE_LEDGER_SYNC_TIMEOUT_SECONDS:-3600}
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  user_data:
  pg_data:
  caddy_data:
  caddy_config:
