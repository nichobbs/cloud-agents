[nuget]
"Lyric.Web"             = "0.7.0"
"Lyric.Docker"          = "0.7.4"
"Std.Logging"           = "0.7.4"
"Microsoft.Data.Sqlite" = "10.0.9"
"SourceGear.sqlite3"    = "3.53.3"
"SQLitePCLRaw.provider.dynamic_cdecl" = "3.0.3"
# Postgres store (docs/phase11-postgres-tenancy.md). Lyric.Db 0.7.4 is built
# against Npgsql 8.0.3; its SQLite driver shares the Microsoft.Data.Sqlite pin
# above.
"Lyric.Db"              = "0.7.4"
"Npgsql"                = "8.0.3"
