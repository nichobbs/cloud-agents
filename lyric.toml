[package]
name        = "CloudAgents"
version     = "0.1.0"
authors     = ["Cloud Agents Developer"]
license     = "MIT"
description = "Cloud Agents backend API server written in Lyric targeting .NET 10"

[features]
default = ["dotnet", "sqlite"]
dotnet  = []
sqlite  = []

[project]
name            = "CloudAgents"
output          = "single"
output_assembly = "CloudAgents.dll"

[project.packages]
"CloudAgents"          = "src/main.l"
"CloudAgents.Text"     = "src/text.l"
"CloudAgents.Ledger.Model" = "src/ledger/model.l"
"CloudAgents.Ledger.StateMachine" = "src/ledger/state_machine.l"
