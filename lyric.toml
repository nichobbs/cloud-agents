# Vendored verbatim from nichobbs/testamur (see vendor/testamur-checkpoint-format/
# VENDORED.md). Package names kept identical to upstream so content addresses match
# and the eventual NuGet swap is a manifest-only change.
"Testamur.CheckpointFormat"       = "vendor/testamur-checkpoint-format/checkpoint_format.l"
"Testamur.CheckpointFormat.Canon" = "vendor/testamur-checkpoint-format/checkpoint_format/canon.l"
