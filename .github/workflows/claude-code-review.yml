name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  # Manual trigger for PRs from forks: a plain `pull_request`-triggered run
  # never receives OIDC tokens or elevated secrets when the PR's head branch
  # is a fork, regardless of the `permissions:` block below — that's a hard
  # GitHub Actions security boundary, not something fixable in this file for
  # the automatic path. A maintainer who has reviewed the fork PR's diff can
  # dispatch this manually instead: it runs with the base repo's own
  # permissions/secrets (workflow_dispatch is never fork-triggered), so
  # `claude-review` works even though the automatic run failed.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review (for a PR from a fork whose automatic pull_request-triggered run failed on OIDC/permissions)'
        required: true
        type: string

# The review prompt and tool allow-list are shared between the primary (Sonnet)
# and fallback (Haiku) invocations.
env:
  REVIEW_PROMPT: |
    REPO: ${{ github.repository }}
    PR NUMBER: ${{ (github.event.pull_request.number || github.event.inputs.pr_number) }}

    You are performing a structured code review. Follow these exact steps in order.

    ## Step 1: Understand the changes
    Run both commands:
    - `gh pr diff ${{ (github.event.pull_request.number || github.event.inputs.pr_number) }} --repo ${{ github.repository }}`
    - `gh pr view ${{ (github.event.pull_request.number || github.event.inputs.pr_number) }} --repo ${{ github.repository }}`

    Also read `CLAUDE.md` at the root of the repository for project conventions.
    This is a Lyric application — read `docs/lyric/reference.md` and
    `docs/lyric/gotchas.md` before judging Lyric syntax, and `docs/BUILD.md`
    for what is and is not buildable under the current compiler.

    ## Step 2: Classify all findings
    Review for: code quality, potential bugs, performance, security, test coverage,
    and adherence to CLAUDE.md conventions.

    Assign each finding exactly one severity:
    - **REQUIRED** — must be resolved before this PR can merge
    - **SUGGESTION** — worthwhile improvement but not a blocker
    - **PRAISE** — positive observation (omit if nothing genuine to note)

    ## Step 3: Create the per-PR label
    Run (ignore errors if it already exists):
    gh label create "pr-${{ (github.event.pull_request.number || github.event.inputs.pr_number) }}" --color "0075ca" --description "Review findings for PR #${{ (github.event.pull_request.number || github.event.inputs.pr_number) }}" --repo ${{ github.repository }} 2>/dev/null || true

    ## Step 4: For each REQUIRED or SUGGESTION finding, create a tracking issue (dedup first)
    Repeat for every finding:

    a) List all open issues already carrying this PR's label to detect duplicates:
       gh issue list --repo ${{ github.repository }} --label "pr-${{ (github.event.pull_request.number || github.event.inputs.pr_number) }}" --state open --json number,title --limit 100

    b) If an issue with the same or substantially similar title already exists,
       do not create a duplicate — record the existing issue number instead.

    c) Otherwise create a new issue and record the returned number:
       gh issue create --repo ${{ github.repository }} --title "[Review] <concise title>" --body "<body with PR number, severity, file location, description>" --label "review-finding" --label "pr-${{ (github.event.pull_request.number || github.event.inputs.pr_number) }}"

       The body must contain: "**PR:** #${{ (github.event.pull_request.number || github.event.inputs.pr_number) }}", "**Severity:** REQUIRED" or "**Severity:** SUGGESTION", the file/line if applicable, and a clear description.

    ## Step 5: Auto-close issues whose findings are now resolved
    For each open issue labeled pr-${{ (github.event.pull_request.number || github.event.inputs.pr_number) }}, if its finding is no longer present in the current diff, close it, ONE issue per command:
    gh issue close <number> --repo ${{ github.repository }} --comment "Finding resolved in the latest commit on PR #${{ (github.event.pull_request.number || github.event.inputs.pr_number) }}."

    ## Step 6: Set or clear the blocking PR label
    If ANY open issues labeled pr-${{ (github.event.pull_request.number || github.event.inputs.pr_number) }} contain "**Severity:** REQUIRED" in their body:
      gh pr edit ${{ (github.event.pull_request.number || github.event.inputs.pr_number) }} --repo ${{ github.repository }} --add-label "review:changes-required"
    Otherwise:
      gh pr edit ${{ (github.event.pull_request.number || github.event.inputs.pr_number) }} --repo ${{ github.repository }} --remove-label "review:changes-required" 2>/dev/null || true

    ## Step 7: Post a summary comment on the PR
    Post one summary comment: gh pr comment ${{ (github.event.pull_request.number || github.event.inputs.pr_number) }} --repo ${{ github.repository }} --body "<summary>"

    The summary must include:
    - Verdict at the top: CHANGES REQUIRED or APPROVED
    - REQUIRED findings with issue links, e.g.: "- REQUIRED: <title> — #<n>"
    - SUGGESTION findings with issue links, e.g.: "- SUGGESTION: <title> — #<n>"
    - PRAISE items (no issue links needed)
    - Any previously open issues that were closed this run

    ## IMPORTANT: how to run every `gh` command above (#796)
    Your Bash tool is restricted to an exact allow-list of command shapes
    (see the tool list you were given). Run every `gh issue ...`/`gh pr ...`/
    `gh label ...` command from steps 3, 4, 5, 6, and 7 exactly as shown,
    ONE command per Bash call:
    - Never wrap them in a shell loop, conditional, subshell, or compound
      command (e.g. `for n in ...; do gh issue close "$n" ...; done`,
      `cmd1 && cmd2`, a `cd` prefix) — issue each one on its own, even when
      you are closing several issues in a row.
    - Always spell the repository flag exactly `--repo ${{ github.repository }}`,
      never the `-R` short form or a positional argument.
    Any other shape will be silently permission-denied rather than run, which
    is confusing to debug from the resulting output — it will look like the
    command was skipped, not blocked.

  REVIEW_TOOLS: 'Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue close:*),Bash(gh label create:*),Bash(gh search:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr edit:*),Bash(cat:*)'

jobs:
  claude-review:
    # Skip draft PRs on the automatic path — review only fires once the PR is
    # ready for review. Doesn't apply to a manual workflow_dispatch run (no
    # github.event.pull_request there at all, so this would otherwise
    # evaluate false and skip every manually-dispatched run outright).
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # pull_request already defaults to the right merge ref via
          # github.ref; workflow_dispatch has no such default, so check out
          # the given PR number's merge ref explicitly in that case.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', github.event.inputs.pr_number) || github.ref }}
          fetch-depth: 1

      # Create well-known labels up front so Claude never races against missing labels.
      - name: Ensure base review labels exist
        run: |
          gh label create "review-finding" \
            --color "e4e669" \
            --description "Issue created from automated code review" \
            --repo "$REPO" 2>/dev/null || true
          gh label create "review:changes-required" \
            --color "d93f0b" \
            --description "Code review requires changes before this PR can merge" \
            --repo "$REPO" 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      # Primary attempt — Sonnet. continue-on-error lets the workflow fall back
      # to Haiku when Sonnet errors (e.g. rate limit).
      - name: Run Claude Code Review (Sonnet)
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: --model sonnet --allowed-tools "${{ env.REVIEW_TOOLS }}"

      # Fallback — Haiku. Runs only if the Sonnet attempt failed.
      - name: Run Claude Code Review (Haiku fallback)
        id: claude-review-haiku
        if: steps.claude-review.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: --model haiku --allowed-tools "${{ env.REVIEW_TOOLS }}"

      # If both attempts errored at the SDK level, fail the job so the workflow
      # doesn't silently report a pass.
      - name: Fail if both review attempts errored
        if: steps.claude-review.outcome == 'failure' && steps.claude-review-haiku.outcome == 'failure'
        run: |
          echo "::error::Both primary (Sonnet) and fallback (Haiku) review attempts errored. Inspect both step logs above."
          exit 1

      # Make "Claude Code Review / claude-review" a blockable required check.
      #
      # #796: the review agent's own gh pr edit --add-label/--remove-label
      # call (REVIEW_PROMPT step 6) runs through Claude's OWN restricted Bash
      # tool allow-list (REVIEW_TOOLS above), which can permission-deny it for
      # reasons that have nothing to do with this job's real GitHub
      # permissions (a compound/loop-wrapped command not matching one of the
      # allowed shapes was the observed pattern) — leaving a stale
      # review:changes-required label with no way to recover, since the
      # documented recovery path ("push a new commit, the review re-runs")
      # just re-hits the same denial every time.
      #
      # This step runs as plain shell with the JOB's own GITHUB_TOKEN (see
      # `permissions:` above), which is NOT subject to Claude's tool
      # allow-list at all — so instead of trusting whatever label the agent's
      # own (possibly-denied) gh pr edit call left behind, it recomputes the
      # label here, directly from which pr-<n> issues are actually still open
      # with "**Severity:** REQUIRED" in their body. A stale label alone can
      # therefore never wedge this check again: if every REQUIRED finding's
      # tracking issue really is closed, the gate passes and clears the label
      # even if the agent's own label-clearing call was denied.
      #
      # This does NOT paper over a denial of the gh issue close calls
      # themselves (step 5) — an issue that failed to close stays open and
      # correctly still blocks merge, exactly as it should for a finding
      # whose resolution was never actually recorded; that half of the fix is
      # the REVIEW_PROMPT instruction above, which tells the agent how to
      # avoid tripping the same allow-list mismatch in the first place.
      - name: Fail if changes are required
        run: |
          REQUIRED_COUNT=$(gh issue list --repo "$REPO" --label "pr-$PR_NUMBER" --state open --json body \
            --jq '[.[] | select(.body | test("\\*\\*Severity:\\*\\* REQUIRED"))] | length' 2>/dev/null || echo "")

          if [ -z "$REQUIRED_COUNT" ]; then
            # Couldn't query the tracker (transient API error, gh/jq hiccup)
            # — fall back to whatever label is currently on the PR rather
            # than silently passing on missing data.
            echo "::warning::could not list open pr-$PR_NUMBER findings; falling back to the review:changes-required label"
            LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
            echo "PR labels: $LABELS"
            if echo "$LABELS" | grep -q "review:changes-required"; then
              echo "::error::Code review requires changes before merge (fallback: could not verify against open findings). Resolve the linked issues, push a new commit, and the review re-runs automatically."
              exit 1
            fi
            echo "Code review passed — no required changes (fallback path)."
            exit 0
          fi

          echo "$REQUIRED_COUNT open REQUIRED finding(s) for pr-$PR_NUMBER"
          if [ "$REQUIRED_COUNT" -gt 0 ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "review:changes-required" 2>/dev/null || true
            echo "::error::Code review requires changes before merge ($REQUIRED_COUNT open REQUIRED finding(s)). Resolve the linked issues, push a new commit, and the review re-runs automatically."
            exit 1
          fi

          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "review:changes-required" 2>/dev/null || true
          echo "Code review passed — no open REQUIRED findings."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ (github.event.pull_request.number || github.event.inputs.pr_number) }}
          REPO: ${{ github.repository }}
