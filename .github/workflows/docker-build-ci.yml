name: Docker build smoke test

# scripts/check-compose-paths.sh (run in ci.yml) only verifies that files
# referenced by the deploy compose files exist on disk — it never actually
# runs `docker build`, so it can't catch a COPY instruction whose source
# doesn't exist inside the *build context* at build time. That's exactly the
# class of bug that broke Coolify deploys before docker/Dockerfile's
# shim-builder stage was added (COPY shim/ ./ + `lyric restore && lyric
# build`, confirmed broken 2026-07-20 — see that Dockerfile's own comments).
# This workflow closes the gap by actually running `docker build` against
# docker/Dockerfile on every PR that touches it or the shim it builds. See
# nichobbs/cloud-agents#607.
#
# The docker-build-shim-builder job only builds --target shim-builder, not
# the full final stage: that's enough to exercise the exact COPY shim/ ./ +
# lyric restore/build path issue #606's predecessor PR was about, while
# skipping the final stage's slowest part (Node/npm/Claude Code CLI
# install) — cheaper, same coverage for the bug class that job guards
# against. Mirrors dist-native-ci.yml's shape (a separate, paths-triggered
# workflow rather than piling another job onto ci.yml) since, like that
# workflow, this only needs to run when the specific files it covers change.
#
# But the final stage itself had NO build coverage at all until the
# docker-build-final-stage job below: PR #764 added a new uv/uvx +
# gettext-base install there (for the seeded "fetch" MCP server, enabled by
# default for every new user), and the shim-builder-only build never reaches
# those lines. #780 is the same bug class as #772 (an instruction-ordering
# bug that only breaks behind a TLS-intercepting proxy) — the difference is
# #772 was in a Dockerfile with no CI coverage at all, while this one was
# hiding in a stage of a Dockerfile that already had *partial* coverage,
# which is easy to mistake for full coverage.
#
# Also builds the three other harness images (Dockerfile.codex/.gemini/
# .opencode, docker-build-harness-images job below) — previously untested by
# any CI check, so an instruction-ordering bug in one of them (e.g. installing
# uv before the CA-trust step ran, breaking the build behind a TLS-
# intercepting proxy, #772) could land undetected. See #764/#780.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docker/Dockerfile'
      - 'docker/Dockerfile.codex'
      - 'docker/Dockerfile.gemini'
      - 'docker/Dockerfile.opencode'
      - 'docker/Dockerfile.antigravity'
      - 'shim/**'
      - 'deploy/api.Dockerfile'
      - 'docker/entrypoint.sh'
      - 'docker/reconcile-repos.sh'
      - 'docker/create-fallback-branch.sh'
      - 'docker/inject-library.sh'
      - 'docker/render-branch-policy.sh'
      - 'docker/register-callbacks-mcp.sh'
      - 'docker/split-ca-bundle.sh'
      - 'docker/mcp-callbacks.json.template'
      - 'docker/settings.json.template'
      - 'docker/settings-callbacks.json.template'
      - 'docker/branch-policy-rules.md'
      - 'docker/session-tools-guide.md'
      - 'scripts/test-entrypoint-privsep.sh'
      - '.github/workflows/docker-build-ci.yml'

concurrency:
  group: docker-build-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (#568, matching dist-native-ci.yml): this job only checks
# out and builds a Docker stage locally — it never pushes an image, writes
# to the repo, comments, or uploads artifacts.
permissions:
  contents: read

jobs:
  docker-build-shim-builder:
    name: Docker build (shim-builder stage)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # docker/Dockerfile's shim-builder stage: pins its own Lyric compiler
      # (issue #606) and does a real `COPY shim/ ./` + `lyric restore &&
      # lyric build` — the exact path that broke under Coolify's bare
      # `docker build`/`docker compose build` invocation before that stage
      # existed. Context is the repo root (not docker/), matching the
      # Dockerfile's own header comment and how every other build of this
      # image is invoked.
      #
      # cache-from/to type=gha: without a persisted layer cache each PR
      # would re-download the dotnet/sdk base image and reinstall curl/
      # ca-certificates plus the pinned Lyric release from scratch — the
      # GitHub Actions cache backend keeps that cheap across runs, same
      # goal as dist-native-ci.yml's npm/NuGet caching, just for Docker
      # layers instead.
      - name: Build shim-builder stage (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: shim-builder
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The full final stage (no --target: the default is the last FROM in the
  # file), where the Node/npm/Claude Code CLI install and — as of #764 — the
  # uv/uvx + gettext-base install actually live. Slower than the
  # shim-builder-only build above (that's the whole reason this was
  # historically skipped), but #780 confirmed that gap now matters: an
  # instruction-ordering bug in this stage has no other way to be caught
  # before it reaches a real deploy.
  docker-build-final-stage:
    name: Docker build (final stage)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build final stage (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha,scope=final-stage
          cache-to: type=gha,mode=max,scope=final-stage

  # docker/entrypoint.sh's privilege drop (#652): only a real container can
  # show which UID actually runs which step, so this runs
  # scripts/test-entrypoint-privsep.sh — which builds its own small
  # purpose-built test image (NOT docker/Dockerfile's full runner image) and
  # exercises the real entrypoint.sh + helper scripts against it directly.
  # This ubuntu-latest runner ships a working `dockerd` already (unlike
  # ci.yml's shell-test job, which explicitly does not assume Docker), so
  # this is the only workflow that can run it.
  docker-build-entrypoint-privsep:
    name: Entrypoint privilege-drop test (real container)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test entrypoint.sh privilege drop
        run: ./scripts/test-entrypoint-privsep.sh

  # docker/Dockerfile.codex/.gemini/.opencode — a full `docker build` of
  # each is the smoke test, same principle as the job above: this is the
  # only thing that catches a broken COPY/instruction-ordering bug (e.g.
  # installing uv before the CA-trust step runs, confirmed broken and fixed
  # in PR #764/#772) before it reaches a real deploy. All three now carry
  # their own shim-builder stage (byte-identical to docker/Dockerfile's —
  # which shares layer cache on a sequential single-host build like
  # Coolify's or build-docker.sh's; in THIS job each matrix build runs in
  # parallel with its own distinct GHA cache scope, so the shim builds
  # once per harness here) and therefore build with the REPO-ROOT context —
  # they COPY both docker/ and shim/, the same #601 requirement the claude
  # image has. Each harness's own header comment documents this.
  docker-build-harness-images:
    name: Docker build (${{ matrix.harness }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [codex, gemini, opencode, antigravity]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker/Dockerfile.${{ matrix.harness }} (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.harness }}
          push: false
          # Reads the default-scope cache too (#816): the shim-builder job
          # above writes there, and the five Dockerfiles' shim-builder
          # stages are byte-identical (check-shim-stage-sync.sh), so each
          # harness build can reuse those layers instead of compiling the
          # shim once per matrix job.
          cache-from: |
            type=gha,scope=${{ matrix.harness }}
            type=gha
          cache-to: type=gha,mode=max,scope=${{ matrix.harness }}

  # deploy/api.Dockerfile's `build` stage: this exact stage is where #673
  # fixed a real Coolify deploy failure (arm64-only "exec format error", exit
  # 126, from an unconditional linux-x64 Lyric download) that only surfaced
  # via a live production deploy — ci.yml's "Verify api.Dockerfile's pinned
  # Lyric release actually exists" step only checks that the pinned
  # linux-x64 tarball downloads, it never runs `docker build` against this
  # Dockerfile at all (#674). --target build stops before the final aspnet
  # runtime stage, mirroring the shim-builder-only job above: cheap, and
  # sufficient to catch a broken COPY/RUN/RID-resolution instruction in the
  # stage that actually does the compiling. Runs on the runner's native
  # amd64 only — no QEMU/buildx arm64 matrix — to keep this job cheap; an
  # arm64-specific regression here (like #673's) would still need a real
  # arm64 host or emulation to catch pre-merge, which is a deliberate,
  # documented gap rather than an oversight.
  docker-build-api:
    name: Docker build (deploy/api.Dockerfile build stage)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api.Dockerfile build stage (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          target: build
          push: false
          cache-from: type=gha,scope=api-build
          cache-to: type=gha,mode=max,scope=api-build
